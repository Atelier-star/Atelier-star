<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Миний бүртгэл — ATELIER</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="announcement">
    ҮНЭГҮЙ ХҮРГЭЛТ • 2026 ОНЫ ШИНЭ ЦУГЛУУЛГА
</div>

<header class="header">
    <a href="index.html" class="logo">ATELIER</a>

    <nav class="nav">
        <a href="index.html">ЭМЭГТЭЙ</a>
        <a href="index.html">ЭРЭГТЭЙ</a>
        <a href="index.html">ХҮҮХЭД</a>
        <a href="index.html">ГУТАЛ</a>
        <a href="index.html">ХУВЦАС</a>
        <a href="index.html">ДАГАЛДАХ ХЭРЭГСЭЛ</a>
        <a href="index.html">ХЯМДРАЛ</a>
    </nav>

    <div class="header-actions">
        <button onclick="window.location.href='index.html'">⌕</button>
        <button onclick="window.location.href='account.html'">♙</button>
        <button onclick="window.location.href='cart.html'">🛍</button>
    </div>
</header>

<main class="account-page">
    <div class="account-box">

        <p class="small-title">ATELIER-Д ТАВТАЙ МОРИЛ</p>

        <h1>ТАВТАЙ МОРИЛ</h1>

        <p>
            Таны захиалга болон бүртгэлийн мэдээлэл.
        </p>

        <div class="account-actions">
            <button
                class="account-button outline"
                onclick="window.location.href='admin.html'">
                АДМИН ХЭСЭГ
            </button>

            <button
                class="account-button"
                onclick="logout()">
                ГАРАХ
            </button>
        </div>

        <div class="my-orders">
            <h2>МИНИЙ ЗАХИАЛГУУД</h2>
            <div id="myOrdersList"></div>
        </div>

    </div>
</main>

<footer>
    <div class="footer-column">
        <h3>ATELIER</h3>
        <p>Өдөр тутмын амьдралд зориулсан орчин үеийн загвар.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
    "https://ajowqplevgcoyjhfqted.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_iefx0_jjyTgqIvVuAjeofw_wqQpopp1";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

async function loadAccountName() {
    const { data, error } =
        await supabaseClient.auth.getUser();

    if (error || !data.user) return;

    const welcomeTitle =
        document.querySelector(".account-box h1");

    if (welcomeTitle) {
        const name =
            data.user.user_metadata.full_name ||
            data.user.email ||
            "ХЭРЭГЛЭГЧ";

        welcomeTitle.textContent =
            "ТАВТАЙ МОРИЛ, " + name.toUpperCase();
    }
}

async function logout() {
    const { error } =
        await supabaseClient.auth.signOut();

    if (error) {
        alert("Гарахад алдаа гарлаа.");
        return;
    }

    alert("Та бүртгэлээс гарлаа.");
    window.location.href = "login.html";
}

async function loadMyOrders() {
    const myOrdersList =
        document.getElementById("myOrdersList");

    if (!myOrdersList) return;

    const { data: userData, error: userError } =
        await supabaseClient.auth.getUser();

    if (userError || !userData.user) {
        myOrdersList.innerHTML =
            "<p>Захиалгаа харахын тулд нэвтэрнэ үү.</p>";
        return;
    }

    const { data: orders, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .eq("user_id", userData.user.id)
            .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        myOrdersList.innerHTML =
            "<p>Захиалгыг ачаалахад алдаа гарлаа.</p>";
        return;
    }

    if (!orders || orders.length === 0) {
        myOrdersList.innerHTML =
            "<p>Одоогоор захиалга байхгүй байна.</p>";
        return;
    }

    myOrdersList.innerHTML = "";

    orders.forEach(function(order) {
        const orderBox = document.createElement("div");
        orderBox.className = "my-order-item";

        orderBox.innerHTML = `
            <h3>${order.order_number}</h3>

            <p>
                <strong>Огноо:</strong>
                ${new Date(order.created_at).toLocaleString("mn-MN")}
            </p>

            <p>
                <strong>Төлөв:</strong>
                ${order.status || "Шинэ захиалга"}
            </p>

            <p>
                <strong>Нийт:</strong>
                ₮${Number(order.total || 0).toLocaleString()}
            </p>

            <p>
                <strong>Хүргэлт:</strong>
                ${order.delivery_name || ""}
            </p>

            <div class="order-products">
                ${(order.items || []).map(function(item) {
                    return `
                        <div class="my-order-product">
                            <strong>${item.name || ""}</strong>
                            <p>
                                Хэмжээ: ${item.size || "-"}
                                &nbsp;|&nbsp;
                                Өнгө: ${item.color || "-"}
                                &nbsp;|&nbsp;
                                Тоо: ${item.quantity || 1}
                            </p>
                            <p>
                                Үнэ: ₮${Number(item.price || 0).toLocaleString()}
                            </p>
                        </div>
                    `;
                }).join("")}
            </div>
        `;

        myOrdersList.appendChild(orderBox);
    });
}

async function checkAuth() {
    const { data } =
        await supabaseClient.auth.getUser();

    if (!data.user) {
        window.location.href = "login.html";
        return false;
    }

    return true;
}

(async function() {
    const authenticated = await checkAuth();
    if (!authenticated) return;

    await loadAccountName();
    await loadMyOrders();
})();
</script>

</body>
</html>
